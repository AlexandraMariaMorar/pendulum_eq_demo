# Frozen experiment settings. Changing this file changes the config hash.
schema_version: 1
experiment_id: pendulum-v1 #keeps track of where the results come from, from which experiment they belong

physics:
  g_over_l: 4.0        # v_dot = -4*sin(theta) - 0.2*v
  damping: 0.2
  t0_seconds: 1.0      # tau = t / t0

solver:
  method: DOP853
  rtol: 1.0e-10 # relative error allowed per step
  atol: 1.0e-12 #absolute error allowed
  tau_max: 10.0 #simulate from time 0 to 10
  dt: 0.02             # save a snapshot every 0.02 time units
  n_states: 501  # number of snapshots: 10/0.02 = 500 steps+1 which is the start 

#starting states and seeds
initial_states: #where each simulates swing starts
  train: [[-2.0, 0.0], [-1.2, 0.5], [-0.6, -0.8], [0.6, 0.8], [1.2, -0.5], [2.0, 0.0]] # each pair is [theta,v] , the starting angle in radians and the starting angular speed ; ex for the first one pulled back about 115 degrees to one side and released from rest
  validation: [[-1.6, 0.3], [1.0, 0.4]]
  test: [[-1.8, -0.2], [-0.9, 0.6], [0.9, -0.6], [1.8, 0.2]] #kept hidden until the end for the final score ; can the learned equation predict swings it never saw?
  pilot_rollout: [[-1.4, 0.2], [1.4, -0.2]]
 #Why these values? 
 #They spread across left and right swings (negative and positive angles)
 #small and large amplitudes, and both directions of motion
 #Large angles like ±2.0 matter, because there sin(theta) is clearly different from theta
 #On small swings only, a method could get away with the simpler -4*theta
seeds:
  repetitions: [101, 102, 103]
  pilot: 999

