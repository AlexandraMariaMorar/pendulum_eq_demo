# Frozen experiment settings. Changing this file changes the config hash.
schema_version: 1
experiment_id: pendulum-v1

physics:
  g_over_l: 4.0        # v_dot = -4*sin(theta) - 0.2*v
  damping: 0.2
  t0_seconds: 1.0      # tau = t / t0
solver:
  method: DOP853
  rtol: 1.0e-10
  atol: 1.0e-12
  tau_max: 10.0
  dt: 0.02             # 501 states, tau = 0..10 inclusive
  n_states: 501

initial_states:
  train: [[-2.0, 0.0], [-1.2, 0.5], [-0.6, -0.8], [0.6, 0.8], [1.2, -0.5], [2.0, 0.0]]
  validation: [[-1.6, 0.3], [1.0, 0.4]]
  test: [[-1.8, -0.2], [-0.9, 0.6], [0.9, -0.6], [1.8, 0.2]]
  # Two plan states plus two extra, so the pilot file has the same shape as test.npz
  pilot_rollout: [[-1.4, 0.2], [1.4, -0.2], [-0.7, -0.5], [0.7, 0.5]]

sampling:
  bins_per_trajectory: 10
  rows_per_bin_total: 50
  per_bin_counts: {120: 2, 300: 5, 600: 10, 1200: 20}
  validation_rows_per_trajectory: 100
  validation_rows: 200

seeds:
  repetitions: [101, 102, 103]
  pilot: 999

noise:
  scale_ddof: 0        # s = std(clean training acceleration), fixed across conditions

conditions:
  c00: {n: 1200, r: 0.0}
  c01: {n: 1200, r: 0.005}
  c02: {n: 1200, r: 0.02}
  c03: {n: 1200, r: 0.05}
  c04: {n: 120,  r: 0.0}
  c05: {n: 300,  r: 0.0}
  c06: {n: 600,  r: 0.0}
fallback_conditions: [c00, c02, c03, c04]

methods: [aifeynman, sindy]

sindy:
  terms: ["1", "theta", "v", "theta**2", "theta*v", "v**2",
          "theta**3", "theta**2*v", "theta*v**2", "v**3",
          "sin(theta)", "cos(theta)", "sin(2*theta)", "cos(2*theta)"]
  thresholds: [0.0, 0.001, 0.003, 0.01, 0.03, 0.1]
  alpha: 0.0
  max_iter: 20
  normalize_columns: false
  unbias: true

aifeynman:
  allowed_operators_must_include: [sin]
  # Package, commit and search settings are filled in after the installation check.
  package: null
  commit: null
  settings: {}

selection:
  tolerance_abs: 0.001
  tolerance_rel: 0.01  # within max(0.001, 0.01*e_min) of best validation error
  complexity: sympy_count_ops
  allowed_symbols: [theta, v]
  allowed_functions: [sin, cos, exp, log, sqrt, tan, tanh, asin, acos, atan]

evaluation:
  success_angle_error: 0.05
  recovery_rel_tol: 0.05
  true_coefficients: {a: 4.0, b: 0.2}
  stop_abs_theta: 10.0
  stop_abs_v: 20.0

budgets_seconds:
  fit: 900
  selection: 60
  rollout_per_trajectory: 30
